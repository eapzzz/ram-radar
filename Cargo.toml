[package]
name = "ram-radar"
version = "0.1.0"
edition = "2021"
authors = ["Julian"]
description = "Realistic Linux RAM and Process Tree Inspector for Arch / Hyprland"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
rayon = "1.10"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
