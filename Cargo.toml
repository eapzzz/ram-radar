[package]
name = "still-monitor"
version = "0.2.0"
edition = "2021"
authors = ["Julian"]
description = "A quiet, capable native Linux system monitor"
license = "MIT"
repository = "https://github.com/eapzzz/still"

[[bin]]
name = "still"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "svg", "file"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
